    <!-- Diagnostics. If anything in the interactive layer throws, say WHAT
         rather than hanging on a loading screen — and make clear it is not a
         network problem, so the two failure modes cannot be confused. -->
    <script>
      window.__yjFail = function (title, detail) {
        var boot = document.getElementById('boot');
        if (!boot) return;
        boot.innerHTML = '';
        var box = document.createElement('div');
        box.setAttribute('style', 'max-width:640px;text-align:left');

        var heading = document.createElement('div');
        heading.setAttribute(
          'style',
          'font-size:17px;font-weight:700;margin-bottom:14px;color:#F0A08C;letter-spacing:.02em'
        );
        heading.textContent = title;
        box.appendChild(heading);

        var body = document.createElement('pre');
        body.setAttribute(
          'style',
          'white-space:pre-wrap;font-size:12px;line-height:1.75;opacity:.82;margin:0;font-family:ui-monospace,Consolas,monospace'
        );
        body.textContent = detail;
        box.appendChild(body);

        boot.appendChild(box);
      };

      // Script errors only. Resource errors (a 404 on content.js, a blocked
      // font) do NOT bubble, so they will never trigger a false alarm here.
      window.addEventListener('error', function (event) {
        var message = event && event.message ? event.message : '未知脚本错误';
        if (event && event.filename) {
          message += '\n  位置：' + event.filename + ':' + (event.lineno || 0) + ':' + (event.colno || 0);
        }
        if (event && event.error && event.error.stack) {
          message += '\n\n' + event.error.stack;
        }
        window.__yjFail('页面脚本出错 —— 这是代码问题，不是网络问题', message);
      });

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason ? event.reason : '未知';
        window.__yjFail(
          '页面出现未处理的异步错误',
          String(reason && reason.stack ? reason.stack : reason)
        );
      });
    </script>

      *,

      /* ------------------------------------------------------------------
         THEME TOKENS — dark base (signature style) ⇄ warm cream (the brief)
         Toggle with the ☼ / ◐ button. Everything below reads these vars,
         so switching the whole site to the warm palette is a one-attribute
         change: <html data-theme="warm">.
         ------------------------------------------------------------------ */
      :root,
      [data-theme='dark'] {
        --bg: #0c0c0c;
        --bg-soft: #131313;
        --card: #0e0e0e;
        --text: #d7e2ea;
        --text-dim: rgba(215, 226, 234, 0.58);
        --line: rgba(215, 226, 234, 0.2);
        --ring: rgba(215, 226, 234, 0.85);
        --panel: rgba(215, 226, 234, 0.05);
        --glow-op: 0.17;
        --h1: #646973;
        --h2: #bbccd7;
        --char-glow: 0.11;
      }

      [data-theme='warm'] {
        --bg: #f7f1e7;
        --bg-soft: #f3e9d8;
        --card: #fffbf3;
        --text: #4b3826;
        --text-dim: rgba(75, 56, 38, 0.62);
        --line: rgba(75, 56, 38, 0.18);
        --ring: rgba(75, 56, 38, 0.5);
        --panel: rgba(75, 56, 38, 0.05);
        --glow-op: 0.55;
        --h1: #a8907a;
        --h2: #4b3826;
        --char-glow: 0.17;
        --warm-mix: 30%;
      }

      /* warm accents — identical in both themes */
      :root {
        --accent: #ed9e5c;
        --peach: #f4b8a4;
        --sage: #a9bc9b;
        --ai: #f8e2a0;
        --psych: #f7d8ce;
        --product: #f6cba0;
        --cream: #f7f1e7;
        --tint: var(--accent);
      }

      html,
      body,
      #root {
        background-color: var(--bg);
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        font-family: Kanit, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      ::selection {
        background: var(--accent);
        color: #fff;
      }

      /* gradient display type, theme aware */
      .hero-heading {
        background: linear-gradient(180deg, var(--h1) 0%, var(--h2) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* per-section warm identity: glow on dark, tinted panel on cream */
      .tinted {
        position: relative;
        background-color: var(--bg);
        transition: background-color 0.5s ease;
      }
      .tint-layer {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: var(--glow-op);
        transition: opacity 0.5s ease;
        background: radial-gradient(72% 62% at 50% 0%, var(--tint) 0%, transparent 70%);
      }
      [data-theme='warm'] .tinted {
        /* The brief wants cream as the BASE and only the later sections
           tinted (AI 淡黄 / Psychology 淡粉 / Product 杏色), so each section
           dials its own strength. The hero sets 6% — essentially cream. */
        background-color: color-mix(in srgb, var(--tint) var(--warm-mix, 30%), var(--bg));
      }
      [data-theme='warm'] .tint-layer {
        /* Tinted sections get their colour from the background mix instead;
           only sections that opt in (the hero) keep a soft warm halo. */
        opacity: var(--warm-glow, 0);
      }

      .rim {
        border-color: var(--ring);
      }
      .card-surface {
        background-color: var(--card);
        border-color: var(--line);
      }
      .txt-dim {
        color: var(--text-dim);
      }

      /* The hero shows the render that matches the current palette:
         the black-background art on the dark base, the white-background art
         on the cream palette. Pure CSS, so the swap is instant and needs no
         JS state. Both files are local, so the hidden one costs nothing. */
      .theme-light-only {
        display: none;
      }
      [data-theme='warm'] .theme-dark-only {
        display: none;
      }
      [data-theme='warm'] .theme-light-only {
        display: block;
      }

      /* MagicRings — the WebGL ring field behind the hero portrait.
         Two additions on top of the published React Bits CSS: the shader has a
         base glow term that fills the whole quad, so on the dark base `screen`
         blending dissolves that fill into the page, and on the cream palette
         the radial mask instead fades out before the canvas edge (64% of the
         farthest corner ≈ 216px, inside the 235px half-width — otherwise a
         soft plate shows). */
      .magic-rings-container {
        width: 100%;
        height: 100%;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 34%, rgba(0, 0, 0, 0) 78%);
        mask-image: radial-gradient(circle at 50% 50%, #000 34%, rgba(0, 0, 0, 0) 78%);
        mix-blend-mode: screen;
      }
      [data-theme='warm'] .magic-rings-container {
        mix-blend-mode: normal;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 24%, rgba(0, 0, 0, 0) 64%);
        mask-image: radial-gradient(circle at 50% 50%, #000 24%, rgba(0, 0, 0, 0) 64%);
      }

      /* character reactions */
      .cj-head {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        transform: rotate(var(--head-rot, 0deg));
        transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .cj-arm-r {
        transform-box: fill-box;
        transform-origin: 50% 8%;
        transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      body[data-react='design'] .cj-arm-r {

      }
      body[data-react='ai'] .cj-head {
        transform: rotate(7deg);
      }
      body[data-react='code'] .cj-arm-r {
        transform: rotate(-10deg);
      }
      body[data-react='psych'] .cj-head {
        transform: rotate(-5deg);
      }

      @keyframes floaty {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -12px;
        }
      }
      @keyframes twinkle {
        0%,
        100% {
          transform: scale(0.4);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }
      @keyframes bubble {
        0%,
        100% {
          transform: translateY(0) scale(1);
          opacity: 0.7;
        }
        50% {
          transform: translateY(-16px) scale(1.08);
          opacity: 1;
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(8px);
        }
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

          transition-duration: 0.001ms !important;
        }
        html {
          scroll-behavior: auto;
        }
      }
    </style>

            aria-label="Portrait placeholder"

      /** Walks the candidate list on each load error. */
      function PortraitImage({ candidates, alt }) {
        const [index, setIndex] = useState(0);
        const [exhausted, setExhausted] = useState(false);

        if (exhausted) return <PortraitPlaceholder />;

        return (
          <img
            src={candidates[index]}
            alt={alt}
            draggable={false}
            style={PORTRAIT_STYLE}
            className="select-none object-contain"
            onError={() => {
              if (index < candidates.length - 1) setIndex(index + 1);
              else setExhausted(true);
            }}
          />
        );
      }

      /** Reads the theme attribute ThemeToggle writes on <html>. The page
       *  switches themes with pure CSS, but the ring shader has to change a
       *  uniform (alphaMode), so it needs the value in React. */
      function useThemeAttr() {
        const [theme, setTheme] = useState(function () {
          return document.documentElement.getAttribute('data-theme') === 'warm' ? 'warm' : 'dark';
        });

        useEffect(function () {
          const root = document.documentElement;
          const read = function () {
            setTheme(root.getAttribute('data-theme') === 'warm' ? 'warm' : 'dark');
          };
          read();
          const observer = new MutationObserver(read);
          observer.observe(root, { attributes: true, attributeFilter: ['data-theme'] });
          return function () {
            observer.disconnect();
          };
        }, []);

        return theme;
      }

      /** Continuous WebGL animation is exactly what this preference is about. */
      function usePrefersReducedMotion() {
        const [reduced, setReduced] = useState(false);

        useEffect(function () {
          if (!window.matchMedia) return undefined;
          const query = window.matchMedia('(prefers-reduced-motion: reduce)');
          const read = function () {
            setReduced(query.matches);
          };
          read();
          query.addEventListener('change', read);
          return function () {
            query.removeEventListener('change', read);
          };
        }, []);

        return reduced;
      }

          onScroll();
          return () => window.removeEventListener('scroll', onScroll);

      function WorksStream() {
        const sectionRef = useRef(null);
        const row1Ref = useRef(null);
        const row2Ref = useRef(null);
        const content = useContent();

        // Your uploaded works when there are any, otherwise the built-in six.
        const items = content.works.length ? content.works : WORKS;
        const tileCount = items.length;
        // Both rows carry every tile, the second rotated by half, so neither
        // row degrades into repeating two pictures when there are only a few.
        const half = Math.max(1, Math.ceil(tileCount / 2));
        const listA = [];
        const listB = [];
        for (let i = 0; i < tileCount; i++) {
          listA.push(i);
          listB.push((i + half) % tileCount);
        }

        const imageAt = (i) => items[i % items.length].image || null;
        const label = content.works.length ? '来自后台 · 向下滚动，它们会往两边走' : '向下滚动，它们会往两边走';

        useEffect(() => {
          let frame = 0;
          const update = () => {
            frame = 0;
            const s = sectionRef.current;
            if (!s) return;
            const offset = (window.scrollY - s.offsetTop + window.innerHeight) * 0.3;
            const shift = offset - 200;
            if (row1Ref.current) row1Ref.current.style.transform = 'translateX(' + shift + 'px)';
            if (row2Ref.current) row2Ref.current.style.transform = 'translateX(' + -shift + 'px)';
          };
          const request = () => {
            if (frame) return;
            frame = window.requestAnimationFrame(update);
          };
          update();
          window.addEventListener('scroll', request, { passive: true });
          window.addEventListener('resize', request);
          return () => {
            window.removeEventListener('scroll', request);
            window.removeEventListener('resize', request);
            if (frame) window.cancelAnimationFrame(frame);
          };
        }, []);

        const Row = ({ list, rowRef }) => (
          <div ref={rowRef} className="flex w-max gap-3" style={{ willChange: 'transform' }}>
            {list.concat(list, list).map((idx, i) => (
              <div key={i} className="shrink-0" style={{ width: 420, height: 300 }}>
                <PosterTile index={idx} image={imageAt(idx)} />
              </div>
            ))}
          </div>
        );

        return (
          <section ref={sectionRef} className="relative py-16 sm:py-20" style={{ overflowX: 'clip' }}>
            <div className="relative z-10 mx-auto mb-8 flex max-w-6xl flex-wrap items-center justify-between gap-3 px-5 sm:px-8 md:px-10">
              <p className="text-[11px] font-medium uppercase tracking-[0.34em]" style={{ color: 'var(--accent)' }}>
                Selected Works · 作品流

              <p className="txt-dim text-[11px] tracking-wide sm:text-xs">{label}</p>
            </div>
            <div className="flex flex-col gap-3">
              <Row list={listA} rowRef={row1Ref} />
              <Row list={listB} rowRef={row2Ref} />
            </div>
          </section>
        );
      }

      /* ------------------------------------------------------------------ */
      /* AI — the workflow that changes as you scroll                        */
      /* ------------------------------------------------------------------ */

      function AiSection() {
        const [mode, setMode] = useState('classic');
        const [pulse, setPulse] = useState(-1);
        const sectionRef = useRef(null);
        const played = useRef(false);

        const play = (next, delay) => {
          setMode(next);
          const words = next === 'ai' ? AI.next : AI.classic;
          words.forEach((w, i) => {
            window.setTimeout(() => {
              setPulse(i);
              window.setTimeout(() => setPulse(-1), 380);
            }, (delay || 0) + i * 130);
          });
        };

        useEffect(() => {
          const el = sectionRef.current;
          if (!el) return;
          const obs = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting && !played.current) {
                  played.current = true;
                  window.setTimeout(() => play('ai', 300), 700);
                  obs.unobserve(el);
                }
              });
            },
            { threshold: 0.35 }
          );
          obs.observe(el);
          return () => obs.disconnect();
        }, []);

        const words = mode === 'ai' ? AI.next : AI.classic;

        return (
          <section id="ai" ref={sectionRef} className="tinted py-20 sm:py-24 md:py-32" style={{ '--tint': 'var(--ai)' }}>
            <div className="tint-layer" />
            <div className="relative z-10 mx-auto grid max-w-6xl items-center gap-12 px-5 sm:px-8 md:grid-cols-[minmax(0,1fr)_minmax(0,420px)] md:gap-16 md:px-10">
              <div>
                <SectionHead eyebrow={AI.eyebrow} title={AI.title} sub={AI.sub} tint="var(--ai)" />

                <FadeIn delay={0.1} y={24} className="mt-9">
                  <div className="flex flex-wrap items-center gap-3">
                    {[
                      { key: 'classic', label: '传统设计工作流' },
                      { key: 'ai', label: 'AI × Vibe Coding' },
                    ].map((b) => (
                      <button
                        key={b.key}
                        type="button"
                        onClick={() => play(b.key, 0)}
                        className={
                          'rounded-full border-2 px-5 py-2.5 text-xs font-medium uppercase tracking-[0.12em] transition-colors duration-300 sm:text-sm ' +
                          (mode === b.key ? 'border-transparent' : 'rim hover:bg-[var(--panel)]')
                        }
                        style={mode === b.key ? { background: 'var(--ai)', color: '#3A2F14' } : undefined}
                      >
                        {b.label}
                      </button>
                    ))}
                  </div>
                </FadeIn>

                <div className="mt-9 flex flex-col items-start gap-2.5">
                  {words.map((w, i) => (
                    <FadeIn key={i} delay={0.12 + i * 0.06} y={18} className="flex flex-col items-start gap-2.5">
                      <span
                        className="rounded-full border px-5 py-2.5 font-black tracking-tight transition-all duration-300"
                        style={{
                          fontSize: 'clamp(1rem, 2.4vw, 1.6rem)',
                          background: pulse === i ? 'var(--ai)' : 'var(--panel)',
                          color: pulse === i ? '#3A2F14' : 'var(--text)',
                          borderColor: mode === 'ai' ? 'var(--ai)' : 'var(--line)',
                          transform: pulse === i ? 'scale(1.05)' : 'none',
                        }}
                      >
                        {w}
                      </span>
                      {i < words.length - 1 ? <span className="txt-dim pl-5 text-sm">↓</span> : null}
                    </FadeIn>
                  ))}
                </div>
              </div>

              <FadeIn delay={0.15} x={30} y={20} duration={0.9} className="mx-auto w-[240px] sm:w-[300px] md:w-full">
                <Character pose="ai" className="h-auto w-full" />
              </FadeIn>
            </div>
          </section>
        );
      }

      /* ------------------------------------------------------------------ */
      /* Vibe Coding — the terminal that becomes a real page                 */
      /* ------------------------------------------------------------------ */

      function CodingSection() {
        const [lines, setLines] = useState([]);
        const [typing, setTyping] = useState(false);
        const [done, setDone] = useState(false);
        const windowRef = useRef(null);
        const played = useRef(false);

        const sleep = (ms) => new Promise((r) => window.setTimeout(r, ms));

        const run = async () => {
          if (typing) return;
          setTyping(true);
          setDone(false);
          setLines([]);
          const acc = [];

          for (let i = 0; i < CODING.lines.length; i++) {
            const text = CODING.lines[i][0];
            const cls = CODING.lines[i][1];

            if (i === 0) {
              for (let j = 1; j <= text.length; j++) {
                acc[i] = { text: text.slice(0, j), cls: cls };
                setLines(acc.slice());
                await sleep(26);
              }
            } else {
              acc[i] = { text: text, cls: cls };
              setLines(acc.slice());
              await sleep(340);
            }
            await sleep(220);
          }

          await sleep(400);
          setDone(true);
          setTyping(false);
        };

        useEffect(() => {
          const el = windowRef.current;
          if (!el) return;
          const obs = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting && !played.current) {
                  played.current = true;
                  window.setTimeout(run, 450);
                  obs.unobserve(el);
                }
              });
            },
            { threshold: 0.35 }
          );
          obs.observe(el);
          return () => obs.disconnect();
        }, []);

        const colorOf = { prompt: '#8CC778', think: '#9BB7A0', act: '#E9C868', done: '#8CC778' };

        return (
          <section id="code" className="tinted py-20 sm:py-24 md:py-32" style={{ '--tint': 'var(--sage)' }}>
            <div className="tint-layer" />
            <div className="relative z-10 mx-auto grid max-w-6xl items-center gap-12 px-5 sm:px-8 md:grid-cols-[minmax(0,1fr)_minmax(0,380px)] md:gap-16 md:px-10">
              <div>
                <SectionHead eyebrow={CODING.eyebrow} title={CODING.title} sub={CODING.sub} tint="var(--sage)" />

                <FadeIn delay={0.12} y={30} className="mt-9">
                  <div
                    ref={windowRef}
                    className="relative overflow-hidden rounded-[22px] border"
                    style={{ background: '#211a12', borderColor: 'rgba(255,255,255,.08)' }}
                  >
                    <div className="flex items-center gap-2 border-b px-4 py-3" style={{ background: '#2e241a', borderColor: 'rgba(255,255,255,.06)' }}>
                      <span className="h-3 w-3 rounded-full" style={{ background: '#F06A5C' }} />
                      <span className="h-3 w-3 rounded-full" style={{ background: '#E9C868' }} />
                      <span className="h-3 w-3 rounded-full" style={{ background: '#8CC778' }} />
                      <span className="ml-2 font-mono text-[11px] text-[#C9B99F]">vibe-coding.sh</span>
                      <button
                        type="button"
                        onClick={run}
                        className="ml-auto font-mono text-sm text-[#C9B99F] transition-colors hover:text-white"
                        title="重新播放"
                      >
                        ↻
                      </button>
                    </div>

                    <pre className="m-0 min-h-[210px] px-5 py-5 font-mono text-[13px] leading-loose text-[#D9CDBB] sm:text-sm">
                      {lines.map((l, i) => (
                        <span key={i} className="block" style={{ color: colorOf[l.cls] || '#D9CDBB' }}>
                          {l.text}
                        </span>
                      ))}
                      {typing ? (
                        <span className="mt-1 block h-4 w-2.5" style={{ background: '#8CC778', animation: 'blink .9s steps(2) infinite' }} />
                      ) : null}
                    </pre>

                    <div
                      className="absolute inset-0 grid place-items-center p-5 transition-opacity duration-500"
                      style={{ background: 'rgba(33,26,18,.96)', opacity: done ? 1 : 0, pointerEvents: done ? 'auto' : 'none' }}
                    >
                      <div className="w-full max-w-[420px] overflow-hidden rounded-2xl" style={{ background: 'var(--bg)' }}>
                        <div className="flex gap-1.5 px-4 py-2.5" style={{ background: 'var(--panel)' }}>
                          <span className="h-2.5 w-2.5 rounded-full" style={{ background: 'var(--line)' }} />
                          <span className="h-2.5 w-2.5 rounded-full" style={{ background: 'var(--line)' }} />
                          <span className="h-2.5 w-2.5 rounded-full" style={{ background: 'var(--line)' }} />
                        </div>
                        <div className="p-6 text-left">
                          <p className="text-[10px] font-semibold uppercase tracking-[0.3em]" style={{ color: 'var(--accent)' }}>
                            Not Just Design
                          </p>
                          <p className="hero-heading mt-2 text-2xl font-black">不止于设计。</p>
                          <p className="txt-dim mt-1 text-sm">一个小想法，刚刚被做出来了。</p>
                          <span className="mt-4 inline-block rounded-full px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.14em]" style={{ background: 'rgba(140,199,120,.18)', color: '#7FBF6A' }}>
                            ● Live
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                </FadeIn>
              </div>

              <FadeIn delay={0.16} x={30} y={20} duration={0.9} className="mx-auto w-[250px] sm:w-[320px] md:w-full">
                <Character pose="coding" className="h-auto w-full" />
              </FadeIn>
            </div>
          </section>
        );
      }

              <FadeIn y={30} className="w-[210px] sm:w-[260px]">
                <div style={{ animation: 'floaty 6s ease-in-out infinite' }}>
                  <Character pose="sitting" className="h-auto w-full" />
                </div>
              </FadeIn>

              <FadeIn as="h2" delay={0.08} y={26} className="mt-6">
                <span className="hero-heading block font-black leading-[1.22] tracking-tight" style={{ fontSize: 'clamp(1.6rem, 4.4vw, 3rem)' }}>
                  {FOOTER.lead[0]}
                  <br />
                  {FOOTER.lead[1]}
                </span>
              </FadeIn>

              <FadeIn delay={0.16} y={18}>
                <p className="mt-4 text-xs font-semibold uppercase tracking-[0.24em] sm:text-sm" style={{ color: 'var(--accent)' }}>
                  {FOOTER.en}
                </p>
              </FadeIn>

              <FadeIn delay={0.22} y={18} className="mt-8 flex flex-wrap items-center justify-center gap-3">
                <ContactButton label={FOOTER.cta} href="#works" />
                <GhostButton label="Back to top" href="#hero" icon={<ArrowUp className="h-4 w-4" />} />
              </FadeIn>

              <FadeIn delay={0.3} y={18} className="mt-14 w-full border-t pt-8" style={{ borderColor: 'var(--line)' }}>
                <p className="txt-dim mx-auto max-w-[620px] text-xs leading-relaxed sm:text-sm">{FOOTER.statement}</p>
                <p className="txt-dim mt-6 text-[10px] font-medium uppercase tracking-[0.3em]">
                  © {new Date().getFullYear()} YIJUN · Not just design · 不止于设计
                </p>
              </FadeIn>
            </div>
          </footer>
        );
      }

      /* ====================================================================
       * App
       * ================================================================== */

      function App() {
        return (
          <ContentProvider>
            <main style={{ overflowX: 'clip' }}>
              <HeroSection />
              <WorksStream />
              <AboutSection />
              <DesignSection />
              <AiSection />
              <CodingSection />
              {/* ProductSection is intentionally not rendered — YIJUN removed
                  the three product cards (MY PORTFOLIO / AI DESIGN TOOL /
                  PSYCHOLOGY CONTENT TOOL). The component and its data stay
                  defined below so restoring it is one line. */}
              <PsychologySection />
              <JourneySection />
              <FooterSection />
            </main>
          </ContentProvider>
        );
      }

      const rootEl = document.getElementById('root');

      try {
        createRoot(rootEl).render(<App />);
      } catch (error) {
        // Leave a visible diagnostic rather than a silent blank page.
        rootEl.innerHTML =
          '<div style="padding:40px;font-family:Kanit,system-ui,sans-serif;color:#D7E2EA;line-height:1.8">' +
          '<div style="font-size:12px;letter-spacing:.3em;opacity:.55">NOT JUST DESIGN</div>' +
          '<div style="font-size:18px;margin-top:12px">页面渲染出错</div>' +
          '<pre style="margin-top:12px;white-space:pre-wrap;font-size:12px;opacity:.75">' +
          String(error) +
          '</pre></div>';
      }

      // Removed after the render attempt: on success React has already cleared
      // the container, on failure the diagnostic above replaced it.
      const bootEl = document.getElementById('boot');
      if (bootEl) bootEl.remove();
    </script>
  </body>
</html>
